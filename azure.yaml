# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: apim-active-caching
metadata:
  template: apim-active-caching@1.0.0
infra:
  provider: terraform
  path: infra
# Two container workloads. azd builds each image, pushes it to the ACR
# (ACR_LOGIN_SERVER comes from the Terraform output) and deploys to the Container
# App / Job that Terraform tagged with the matching azd-service-name.
services:
  middleware:
    project: ./middleware
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      registry: ${ACR_LOGIN_SERVER}
  # Container Apps Job (cron). azd targets it via the azd-service-name=refresher
  # tag; host is still `containerapp` (azd detects the job resource type).
  refresher:
    project: ./refresher
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      registry: ${ACR_LOGIN_SERVER}
